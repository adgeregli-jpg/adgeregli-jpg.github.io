<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Matetristik: matematik + Tetris. Soruyu bil, parçayı yönet. Hem eğlence hem çalışma.">
<meta property="og:title" content="Matetristik">
<meta property="og:description" content="Matematik + Tetris. Soruyu bil, parçayı yönet!">
<meta name="theme-color" content="#14181f">
<style>body{margin:0}</style>
</head>
<body><title>Matetristik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kara tahta zemini; solda büyük oyun alanı, sağda soru panosu. Tek koyu görünüm (bilinçli). */
:root{
  --bg:#141a1f;          /* kara tahta */
  --bg-2:#1b232a;
  --panel:#202a32;
  --line:#2f3c46;
  --fg:#e9eef0;          /* tebeşir beyazı */
  --muted:#93a3ad;
  --accent:#ffd34e;      /* tebeşir sarısı */
  --good:#5fd68a;
  --bad:#ff6b6b;
  --info:#6cc5ff;
  --f-display:"Bungee", "Impact", "Arial Black", system-ui, sans-serif;
  --f-body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math:"JetBrains Mono", ui-monospace, "Consolas", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;box-sizing:border-box;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
kbd{font-family:var(--f-math);font-size:12px;background:var(--bg-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--fg)}

/* ---------- Menü ---------- */
#menu{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:8px 20px}
.langbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.lang{background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.lang[aria-pressed="true"]{background:var(--fg);color:#121212;border-color:var(--fg)}
.hero{position:relative;border-radius:16px;overflow:hidden;background:#0d1216;border:2px solid var(--line);min-height:260px;display:flex;align-items:flex-end}
#cover{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,18,22,.92) 0%,rgba(13,18,22,.6) 55%,rgba(13,18,22,.15) 100%);pointer-events:none}
.hero-in{position:relative;z-index:1;padding:28px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px;max-width:780px}
.tiles{margin:0;display:flex;flex-direction:column;gap:6px;font-weight:400}
.word{display:flex;flex-wrap:wrap;gap:4px}
.tile{--s:clamp(28px,5vw,56px);width:var(--s);height:var(--s);display:grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--s)*.58);color:#121212;border-radius:calc(var(--s)*.18);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 60%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 72%,#000) 100%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 50%,#000),0 4px 0 color-mix(in srgb,var(--c) 45%,#000);
  animation:drop .5s cubic-bezier(.3,1.4,.6,1) backwards;animation-delay:calc(var(--i)*45ms)}
.tile.op{color:#fff;background:#26323b;box-shadow:inset 0 0 0 2px #3a4954,0 4px 0 #0a0f13}
@keyframes drop{from{transform:scale(.5)}}
.lede{margin:0;color:var(--fg);max-width:58ch;line-height:1.6;font-size:16px}
.brain{display:flex;flex-direction:column;gap:12px}
.brain h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,2.4vw,24px);text-wrap:balance}
.brain-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.brain-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.brain-grid{grid-template-columns:1fr}}
.brain-grid div{background:var(--panel);border-radius:10px;padding:14px;color:var(--muted);font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.brain-grid b{color:var(--fg);font-size:15px}
.brain-grid i{font-style:normal;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:#121212;font-weight:700;font-size:18px;margin-bottom:4px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tiers{grid-template-columns:1fr}}
.tier{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.tier:hover{border-color:var(--muted);transform:translateY(-2px)}
.tier[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.t-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-name{font-family:var(--f-display);font-size:19px}
.t-step{font-family:var(--f-math);font-size:12px;color:var(--muted);text-align:right}
.t-desc{color:var(--muted);font-size:13.5px;line-height:1.45}
.t-sample{font-family:var(--f-math);color:var(--accent);font-size:14px}
.t-best{font-size:12px;color:var(--muted)}
.start-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.btn-main{background:var(--accent);color:#1a1a1a;border:0;border-radius:10px;padding:16px 30px;font-family:var(--f-display);font-size:19px;box-shadow:0 4px 0 #a8862a}
.btn-main:hover{filter:brightness(1.07)}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #a8862a}
.lb-sec{display:flex;flex-direction:column;gap:10px}
.lb-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lb-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,2.4vw,24px)}
.lb-note{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;max-width:70ch}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:640px}
.lb li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--panel);border-radius:8px;padding:10px 14px}
.lb .rk{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.lb li:nth-child(1) .rk{color:#ffd34e} .lb li:nth-child(2) .rk{color:#cfd8dc} .lb li:nth-child(3) .rk{color:#ff9a3c}
.lb .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .mt{font-size:12px;color:var(--muted);white-space:nowrap}
.lb .sc{font-family:var(--f-math);font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent)}
.lb li.me{outline:2px solid var(--accent)}
.lb .empty{display:block;color:var(--muted);text-align:center;padding:16px}
@media (max-width:480px){.lb .mt{display:none}.lb li{grid-template-columns:32px minmax(0,1fr) auto}}
.savef{display:flex;gap:8px}
.savef input{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font:inherit}
.savef input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.savef button{background:var(--accent);color:#1a1a1a;border:0;border-radius:10px;padding:12px 14px;font-weight:700}
.savef button:disabled{opacity:.5}
.save-msg{color:var(--good);min-height:1.3em;font-size:14px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;color:var(--muted);font-size:13.5px;line-height:1.6}
.rules div{border-top:1px solid var(--line);padding-top:10px}
.rules b{color:var(--fg);display:block;margin-bottom:2px}

/* ---------- Oyun ---------- */
#game{display:flex;gap:22px;justify-content:center;align-items:flex-start;height:100%}
.board-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
#board{display:block;background:#0d1216;border:3px solid var(--line);border-radius:8px;touch-action:none;box-shadow:0 0 0 6px #0d1216,0 20px 50px rgba(0,0,0,.45)}
.side{flex:0 1 400px;max-width:100%;display:flex;flex-direction:column;gap:14px;min-width:0}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border-radius:8px;padding:8px 10px;min-width:0}
.multb{color:var(--warn,#ffd166);font-family:var(--f-math);font-weight:700}
.stat .v{font-family:var(--f-math);font-size:22px;font-variant-numeric:tabular-nums}
.lvl{background:var(--panel);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lvl-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lvl-name{font-weight:700;min-width:0}
.bar{height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.qcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s}
.qcard.ok{border-color:var(--good)} .qcard.no{border-color:var(--bad)}
.qtext{font-family:var(--f-math);font-size:clamp(22px,2.6vw,32px);font-weight:700;text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.25em;line-height:1.3;overflow-wrap:anywhere}
.qtext sub,.qtext sup{font-size:.6em}
.qtext small{font-size:.5em;font-weight:500;color:var(--muted);flex-basis:100%}
.qhint{text-align:center;color:var(--muted);font-size:13px;min-height:1.3em;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--bg-2);border:2px solid var(--line);border-radius:12px;padding:16px 8px;font-family:var(--f-math);font-size:26px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums;min-height:72px;touch-action:manipulation;box-shadow:0 3px 0 #0d1216}
.opt small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--bg-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg-2))}
.passbtn{background:transparent;border:1px dashed var(--muted);border-radius:10px;padding:9px;font-size:13px;color:var(--fg);touch-action:manipulation}
.passbtn:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.passbtn:disabled{opacity:.35;cursor:default}
.status{min-height:1.5em;text-align:center;font-weight:500}
.status.ok{color:var(--good)} .status.no{color:var(--bad)} .status.wait{color:var(--info)}
.timer{height:5px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--info)}
.row2{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:stretch}
.next{background:var(--panel);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.help{font-size:12.5px;color:var(--muted);line-height:1.9;background:var(--panel);border-radius:8px;padding:8px 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.touch{display:none;gap:10px;width:100%;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.touch button{background:var(--panel);border:2px solid var(--line);border-radius:12px;flex:1;max-width:76px;height:60px;font-size:24px;touch-action:none}
.touch button:active{background:var(--line);border-color:var(--accent)}
.touch .tpause{display:none;max-width:52px;font-size:16px}
.touch-hint{display:none;font-size:12px;color:var(--muted);text-align:center}
@media (pointer:coarse){.touch{display:flex}.touch-hint{display:block}.help{display:none}}
@media (max-width:720px){
  #game{flex-direction:column;align-items:center;height:auto;gap:10px}
  .side{width:100%;flex:none;order:-1;gap:8px}
  #lvlNeed{display:none}
  .hud .stat{padding:4px 8px}.hud .multb{color:var(--warn,#ffd166);font-family:var(--f-math);font-weight:700}
.stat .v{font-size:18px}
  .qcard{padding:10px 12px;gap:8px}
  .qtext{font-size:22px;min-height:2.4em}
  .opt{padding:10px 6px;font-size:22px;min-height:58px}
  .row2,.toolbar .tbtn:not(#pauseBtn){display:none}
  .lvl{padding:6px 10px}
}
/* Telefon: tahtaya en fazla yeri bırak */
@media (max-width:720px) and (pointer:coarse){
  .lvl,#qLabel,#prev,.toolbar{display:none}
  .qcard{gap:6px}
  .qtext{min-height:2.2em;font-size:21px}
  .opt{min-height:52px;padding:6px}
  .opt small{display:none}
  .touch button{height:52px}
  .touch .tpause{display:block}
}

/* Kaplamalar */
.overlay{position:fixed;inset:0;background:rgba(8,11,14,.78);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:26px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.modal h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:30px}
.modal .big{font-family:var(--f-math);font-size:40px;color:var(--accent)}
.modal .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-sec{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--accent);color:#1a1a1a;font-family:var(--f-display);padding:10px 20px;border-radius:8px;z-index:30;font-size:18px;pointer-events:none;animation:pop 2.2s ease forwards;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<!-- ================= MENÜ ================= -->
<section id="menu">
  <div class="langbar" id="langbar" role="group" aria-label="Language"></div>

  <header class="hero">
    <canvas id="cover" aria-hidden="true"></canvas>
    <div class="hero-in">
      <div class="label" data-t="eyebrow"></div>
      <h1 class="tiles" id="title"><span class="word" id="w1"></span><span class="word" id="w2"></span></h1>
      <p class="lede" data-t="lede"></p>
    </div>
  </header>

  <div class="brain">
    <h2 data-t="brainTitle"></h2>
    <div class="brain-grid">
      <div><i style="--c:#ffd34e">+</i><b data-t="b1t"></b><span data-t="b1d"></span></div>
      <div><i style="--c:#3ee0f0">⟳</i><b data-t="b2t"></b><span data-t="b2d"></span></div>
      <div><i style="--c:#ff5c7a">⏱</i><b data-t="b3t"></b><span data-t="b3d"></span></div>
      <div><i style="--c:#4ee08a">◎</i><b data-t="b4t"></b><span data-t="b4d"></span></div>
    </div>
  </div>

  <div class="label" data-t="step1"></div>
  <div class="tiers" id="tiers"></div>

  <div class="label" data-t="step2"></div>
  <div class="chips" id="chips"></div>

  <div class="start-row">
    <button class="btn-main" id="startBtn" data-t="start"></button>
    <span class="label" id="startInfo"></span>
  </div>

  <section class="lb-sec">
    <div class="lb-head"><h2 data-t="lbTitle"></h2><span class="label" id="lbTier"></span></div>
    <p class="lb-note" data-t="lbNote"></p>
    <ol class="lb" id="lb"></ol>
  </section>

  <div class="rules">
    <div><b data-t="r1t"></b><span data-t="r1d"></span></div>
    <div><b data-t="r2t"></b><span data-t="r2d"></span></div>
    <div><b data-t="r3t"></b><span data-t="r3d"></span></div>
    <div><b data-t="r4t"></b><span data-t="r4d"></span></div>
  </div>
</section>

<!-- ================= OYUN ================= -->
<section id="game" class="hidden">
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="touch" id="touch">
      <button data-a="left" aria-label="◀">◀</button>
      <button data-a="rot" aria-label="⟳">⟳</button>
      <button data-a="right" aria-label="▶">▶</button>
      <button data-a="down" aria-label="▼">▼</button>
      <button data-a="drop" aria-label="⤓">⤓</button>
      <button data-a="pause" class="tpause" aria-label="Pause">❚❚</button>
    </div>
    <div class="touch-hint" data-t="touchHint"></div>
  </div>

  <aside class="side">
    <div class="hud">
      <div class="stat"><div class="label"><span data-t="score"></span> <span class="multb" id="mult">×1</span></div><div class="v" id="score">0</div></div>
      <div class="stat"><div class="label" data-t="lines"></div><div class="v" id="lines">0</div></div>
      <div class="stat"><div class="label" data-t="streak"></div><div class="v" id="streak">0</div></div>
    </div>

    <div class="lvl">
      <div class="lvl-top"><span class="lvl-name" id="lvlName">—</span><span class="label" id="lvlStep">—</span></div>
      <div class="bar"><i id="lvlBar"></i></div>
      <div class="label" id="lvlNeed">—</div>
    </div>

    <div class="qcard" id="qcard">
      <div class="label" id="qLabel">—</div>
      <div class="qtext" id="qtext">—</div>
      <div class="opts">
        <button class="opt" id="opt0"><span>—</span><small data-t="key1"></small></button>
        <button class="opt" id="opt1"><span>—</span><small data-t="key2"></small></button>
      </div>
      <button class="passbtn" id="passBtn"></button>
      <div class="timer"><i id="timerBar"></i></div>
      <div class="status wait" id="status"></div>
      <div class="qhint" id="prev"></div>
    </div>

    <div class="row2">
      <div class="next"><div class="label" data-t="next"></div><canvas id="next" width="96" height="96"></canvas></div>
      <div class="help" data-t="help"></div>
    </div>

    <div class="toolbar">
      <button class="tbtn" id="pauseBtn"></button>
      <button class="tbtn" id="muteBtn"></button>
      <button class="tbtn" id="menuBtn" data-t="toMenu"></button>
    </div>
  </aside>
</section>

<div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(() => {
"use strict";

/* ================= Diller ================= */
const LANGS = [["tr","Türkçe"],["en","English"],["es","Español"],["ru","Русский"],["de","Deutsch"],["fr","Français"]];
const K = '<kbd>←</kbd> <kbd>→</kbd>', KU = '<kbd>↑</kbd>', KD = '<kbd>↓</kbd>';
const I18N = {
 tr: {
  eyebrow:"Hesapla · Döndür · Yerleştir",
  lede:"Eğlenirken çalış, çalışırken eğlen. Her parça düşerken bir soru gelir. Doğru cevap parçanın kontrolünü sana verir. Yanlış cevapta parça olduğu yerden dümdüz aşağı iner.",
  brainTitle:"Beynin birçok bölümü aynı anda çalışır",

/* ================= Yardımcılar ================= */
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
const sup = n => String(n).split("").map(c => SUP[c] || c).join("");
const neg = n => n < 0 ? `(−${-n})` : `${n}`;          // negatif sayıyı parantezle yaz
const sgn = n => n < 0 ? `− ${-n}` : `+ ${n}`;          // "+ 3" / "− 3"
const fmt = n => n < 0 ? `−${-n}` : `${n}`;
const nz = (a, b) => { let v; do v = ri(a, b); while (v === 0); return v; };
const tpl = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");

// Yanlış şık: doğru cevaba yakın ama farklı, mantıklı bir sayı.
function makeWrong(ans, allowNeg) {
  const mag = Math.abs(ans);
  const step = mag < 20 ? 1 : mag < 200 ? pick([1, 2, 10]) : Math.max(1, Math.round(mag * 0.03));
  for (let t = 0; t < 30; t++) {
    let w = ans + (Math.random() < .5 ? -1 : 1) * step * ri(1, 3);
    if (!allowNeg && ans >= 0 && w < 0) w = ans + step * ri(1, 3);
    if (w !== ans) return w;
  }
  return ans + 1;
}
// Soru nesnesi: html = gösterilecek ifade, ans = doğru cevap. "?" içermeyen ifadelere " = ?" eklenir.
const Q = (html, ans, o = {}) => ({ html, ans, wrong: o.wrong ?? makeWrong(ans, o.neg ?? ans < 0) });

function answer(i) {

/* ================= Hareket ================= */

// Hız: her sorudan sonra %1,4 hızlanır (100 soruda ~4 kat); hızlı ve doğru cevaplar (boost) ayrıca hızlandırır.

// Tahtada hareketler: dokun = döndür, sağa/sola sürükle = kaydır, yavaş aşağı = hızlandır, hızlı aşağı fırlat = bırak
let sw = null;
$("board").addEventListener("pointerdown", e => {

  e.preventDefault(); ensureAudio();

const cv = $("board"), ctx = cv.getContext("2d");

let CELL = 32;
function resize() {

// Renk tonları: her renk için açık/koyu tonlar bir kez hesaplanıp saklanır.
const shadeCache = new Map();

}

  for (const q of G.parts) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += .0012 * dt;

    block(ctx, X, Y, CELL, G.mode === "plunge" ? "#ff5c7a" : p.c);
    if (G.mode === "question") {          // kilitli: önce cevapla
      ctx.globalAlpha = pulse; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      rr(ctx, X + 1, Y + 1, CELL - 2, CELL - 2, CELL * .2); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(13,18,22,.7)"; ctx.fillText("?", X + CELL / 2, Y + CELL / 2 + 1);
    }
  } }));
}
function drawNext() {
  nctx.clearRect(0, 0, 96, 96);
  const p = G.next, s = 20;
  let minC = 9, maxC = 0, minR = 9, maxR = 0;
  p.m.forEach((r, ri_) => r.forEach((v, c) => { if (v) { minC = Math.min(minC, c); maxC = Math.max(maxC, c); minR = Math.min(minR, ri_); maxR = Math.max(maxR, ri_); } }));
  const ox = (96 - (maxC - minC + 1) * s) / 2 - minC * s, oy = (96 - (maxR - minR + 1) * s) / 2 - minR * s;
  p.m.forEach((row, r) => row.forEach((v, c) => { if (v) block(nctx, ox + c * s, oy + r * s, s, p.c); }));
}

/* ================= HUD ================= */
function updateHud() {
  $("score").textContent = G.score;
  $("mult").textContent = "×" + mult();
  $("lines").textContent = G.lines;
  $("streak").textContent = G.streak;
  const inStage = G.done - (G.level - G.startLevel) * QPER;
  $("lvlName").textContent = `${tierName(G.tierIdx)} · ${levelName(G.tierIdx, G.level)}`;
  $("lvlStep").textContent = tpl(T().step, { n: G.level + 1, m: G.tier.levels.length });
  $("lvlBar").style.width = Math.min(100, inStage / QPER * 100) + "%";
  $("lvlNeed").textContent = tpl(T().need, { n: Math.min(G.done + 1, totalQ()), m: totalQ(), s: (TIERS[0].speed / gravity()).toFixed(1) });
}
function updateTimer() {
  const bar = $("timerBar");
  if (!G || G.mode !== "question" || G.answered || !G.piece) { bar.style.width = "0%"; return; }
  // Kalan süre: parçanın yere değmesine kaç satır kaldı
  const p = G.piece; let gy = p.y; while (!collides(p.m, p.x, gy + 1)) gy++;
  const total = Math.max(1, gy - G.spawnRow), left = gy - p.y + (1 - G.lockT / LOCK_DELAY) * .5;
  const f = Math.max(0, Math.min(1, left / total));
  bar.style.width = f * 100 + "%";
  bar.style.background = f < .3 ? "var(--bad)" : "var(--info)";
}

/* ================= Döngü ================= */
function step(dt) {
  const p = G.piece;
  if (G.mode === "plunge") {               // yanlış cevap: parça hızla dümdüz iner
    G.acc += dt;
    while (G.acc >= 28) { G.acc -= 28; if (!tryMove(0, 1)) { addTrail(G.plungeY); lockPiece(); return; } }
    return;
  }
  if (collides(p.m, p.x, p.y + 1)) {       // yerde: kısa kayma payı, sonra kilitlen
    G.acc = 0; G.lockT += dt;
    if (G.lockT >= LOCK_DELAY) lockPiece();
    return;
  }
  G.acc += dt;
  const iv = G.mode === "question" ? questionGravity() : gravity();
  if (G.acc >= iv) { G.acc -= iv; tryMove(0, 1); }
}
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(100, t - lastT); lastT = t;
  if (G && G.state === "playing") holdTick(dt);
  if (G && G.state === "playing") step(dt);
  if (!$("menu").classList.contains("hidden")) drawCover(dt);
  else { draw(dt); updateTimer(); }
  requestAnimationFrame(loop);
}

/* ================= Ekranlar ================= */
function showMenu() {
  if (G) G.state = "menu";
  held.clear(); closeOverlay();
  $("game").classList.add("hidden"); $("menu").classList.remove("hidden");
  renderMenu();
}
function startGame() {
  store.set("mt_tier", tierIdx);
  $("menu").classList.add("hidden"); $("game").classList.remove("hidden");
  $("prev").textContent = "";
  newGame(); updateHud(); resize(); ensureAudio();
  $("pauseBtn").textContent = T().pause;
}
function togglePause() {
  if (!G || G.state === "over" || G.state === "menu") return;
  if (G.state === "playing") {
    G.state = "paused"; held.clear(); $("pauseBtn").textContent = T().resume;
    openOverlay(`<h2>${T().paused}</h2><p class="label">${T().pausedHint}</p>
      <div class="btns"><button class="btn-main" data-x="resume">${T().cont}</button><button class="btn-sec" data-x="menu">${T().menu}</button></div>`);
  } else { G.state = "playing"; $("pauseBtn").textContent = T().pause; closeOverlay(); lastT = performance.now(); }
}
/* ================= Sıralama ================= */
// Veri katmanı: şimdilik bu cihazda (localStorage) tutulur. Online sürümde aynı iki fonksiyon
// (submit, top) sunucuya bağlanacak; ekran kodu değişmeyecek.
const Board = {
  key: tier => "mt_lb_" + tier,
  top(tier) { return store.get(this.key(tier), []); },
  submit(tier, entry) {
    const list = this.top(tier);
    list.push(entry);
    list.sort((a, b) => b.score - a.score || a.t - b.t);
    store.set(this.key(tier), list.slice(0, 50));
    return list.indexOf(entry) + 1;   // sıra (1'den başlar)
  },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let lastSaved = null;   // listede vurgulanacak son kayıt
function renderLeaderboard() {
  const t = TIERS[tierIdx], list = Board.top(t.id).slice(0, 10);
  $("lbTier").textContent = tierName(tierIdx);
  $("lb").innerHTML = list.length ? list.map((e, i) => `
    <li class="${lastSaved && e.t === lastSaved ? "me" : ""}">
      <span class="rk">${i + 1}</span><span class="nm">${esc(e.name)}</span>
      <span class="mt">${tpl(T().lbStage, { n: e.stage })} · ${e.correct}/${e.total}</span>
      <span class="sc">${e.score}</span>
    </li>`).join("") : `<li><span class="empty">${T().lbEmpty}</span></li>`;
}
function saveScore(e) {
  e.preventDefault();
  const name = $("nameIn").value.trim().slice(0, 16);
  if (!name || !G || G.saved) return;
  store.set("mt_name", name);
  const entry = { name, score: G.score, stage: G.level + 1, correct: G.correct, total: G.done, t: Date.now() };
  const rank = Board.submit(G.tier.id, entry);
  G.saved = true; lastSaved = entry.t;
  $("saveBtn").disabled = $("nameIn").disabled = true;
  $("saveMsg").textContent = tpl(T().saved, { r: rank });
}

function gameOver(win = false) {
  G.state = "over"; held.clear();
  const key = "mt_best_" + G.tier.id, best = store.get(key, 0), isBest = G.score > best;
  if (isBest) store.set(key, G.score);
  const acc = G.asked ? Math.round(G.correct / G.asked * 100) : 0;
  if (win) { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .15), i * 120)); }
  else { beep(300, .2); setTimeout(() => beep(220, .3), 180); }
  openOverlay(`<h2>${win ? T().win : T().over}</h2>
    <div class="big">${G.score}</div>
    ${win ? `<div>${tpl(T().winText, { c: G.correct, m: G.done })}</div>` : ""}
    <div>${isBest && G.score > 0 ? T().newBest : tpl(T().best, { n: Math.max(best, G.score) })}</div>
    <div class="label">${tpl(T().summary, { tier: tierName(G.tierIdx), n: G.level + 1, l: G.lines, acc })}</div>
    ${G.score > 0 ? `<form class="savef" id="saveForm"><input id="nameIn" maxlength="16" autocomplete="nickname" placeholder="${T().namePh}" aria-label="${T().namePh}" value="${esc(store.get("mt_name", ""))}"><button id="saveBtn">${T().save}</button></form>
    <div class="save-msg" id="saveMsg"></div>` : ""}
    <div class="btns"><button class="btn-main" data-x="again">${T().again}</button><button class="btn-sec" data-x="menu">${T().choose}</button></div>`);
}
function openOverlay(html) {
  $("modal").innerHTML = html; $("overlay").classList.remove("hidden");
  $("saveForm")?.addEventListener("submit", saveScore);
  ($("nameIn") || $("modal").querySelector("button"))?.focus();
}
function closeOverlay() { $("overlay").classList.add("hidden"); }
$("modal").addEventListener("click", e => {
  const x = e.target.closest("button")?.dataset.x;
  if (x === "resume") togglePause();
  else if (x === "menu") showMenu();
  else if (x === "again") { closeOverlay(); startGame(); }
});
$("pauseBtn").addEventListener("click", togglePause);
$("menuBtn").addEventListener("click", showMenu);
$("muteBtn").addEventListener("click", toggleMute);
$("startBtn").addEventListener("click", startGame);

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T()[el.dataset.t]; });
  $("langbar").innerHTML = LANGS.map(([k, n]) => `<button class="lang" data-l="${k}" aria-pressed="${k === lang}">${n}</button>`).join("");
  $("title").setAttribute("aria-label", "Matetristik");
  buildTitle();
  $("muteBtn").textContent = muted ? T().soundOff : T().soundOn;
  renderMenu();
}
$("langbar").addEventListener("click", e => { const b = e.target.closest(".lang"); if (!b) return; lang = b.dataset.l; store.set("mt_lang", lang); applyLang(); });

function renderMenu() {
  $("tiers").innerHTML = TIERS.map((t, i) => `
    <button class="tier" data-i="${i}" aria-pressed="${i === tierIdx}">
      <span class="t-head"><span class="t-name">${tierName(i)}</span><span class="t-step">${tpl(T().levels, { n: t.levels.length, q: t.levels.length * QPER })} · <b class="multb">×${t.mult}</b></span></span>
      <span class="t-desc">${T().tiers[i][1]}</span>
      <span class="t-sample">${t.sample}</span>
      <span class="t-best">${tpl(T().best, { n: store.get("mt_best_" + t.id, 0) })}</span>
    </button>`).join("");
  if (startLevel >= TIERS[tierIdx].levels.length) startLevel = 0;
  $("chips").innerHTML = T().tiers[tierIdx][2].map((l, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === startLevel}">${i + 1}. ${l}</button>`).join("");
  $("startInfo").textContent = tpl(T().startInfo, { tier: tierName(tierIdx), n: startLevel + 1, name: levelName(tierIdx, startLevel) });
  renderLeaderboard();
}
$("tiers").addEventListener("click", e => { const b = e.target.closest(".tier"); if (!b) return; tierIdx = +b.dataset.i; startLevel = 0; renderMenu(); });
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; startLevel = +b.dataset.i; renderMenu(); });

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }

/* ================= Ses ================= */
let AC = null;
function ensureAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === "suspended") AC.resume().catch(() => {}); }
function beep(f, d, type = "triangle") {
  if (muted || !AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d + .02);
  } catch {}
}
function toggleMute() { muted = !muted; store.set("mt_muted", muted); $("muteBtn").textContent = muted ? T().soundOff : T().soundOn; }

/* ================= Kapak ================= */
// Başlık: "MATETRİSTİK", her harf bir Tetris bloğu; altında işlem taşları
const PAL = Object.values(SHAPES).map(s => s.c);
function buildTitle() {
  let i = 0;
  const tile = (ch, op) => `<span class="tile${op ? " op" : ""}" style="--c:${PAL[i % PAL.length]};--i:${i++}" aria-hidden="true">${ch}</span>`;
  const name = lang === "tr" ? "MATETRİSTİK" : "MATETRISTIK";
  $("w1").innerHTML = [...name].map(ch => tile(ch)).join("");
  $("w2").innerHTML = ["+", "−", "×", "÷", "="].map(ch => tile(ch, true)).join("");
}
// Arka planda üzerinde matematik sembolleri olan parçalar yağar
const cov = $("cover"), cc = cov.getContext("2d");
const SYMS = ["+", "−", "×", "÷", "=", "√", "π", "Σ", "∫", "%", "²", "∞"];
let covP = [], covAcc = 1000, covW = 0, covH = 0;
function drawCover(dt) {
  const w = cov.clientWidth, h = cov.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!w) return;
  if (w !== covW || h !== covH) { covW = w; covH = h; cov.width = w * dpr; cov.height = h * dpr; cc.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const s = Math.max(22, Math.min(34, w / 30));
  covAcc += dt;
  if (covAcc > 650 && covP.length < 14) {
    covAcc = 0;
    const k = pick(Object.keys(SHAPES)); let m = SHAPES[k].m; for (let r = ri(0, 3); r > 0; r--) m = rotate(m);
    covP.push({ m, c: SHAPES[k].c, x: w * (.3 + Math.random() * .62), y: -s * 4, v: .03 + Math.random() * .04, sym: m.map(row => row.map(() => pick(SYMS))) });
  }
  cc.clearRect(0, 0, w, h);
  cc.textAlign = "center"; cc.textBaseline = "middle"; cc.font = `700 ${Math.floor(s * .5)}px "JetBrains Mono", monospace`;
  covP = covP.filter(p => (p.y += p.v * dt) < h + s);
  for (const p of covP) p.m.forEach((row, r) => row.forEach((v, c) => {
    if (!v) return;
    const X = p.x + c * s, Y = p.y + r * s;
    block(cc, X, Y, s, p.c);
    cc.fillStyle = "rgba(10,14,18,.75)"; cc.fillText(p.sym[r][c], X + s / 2, Y + s / 2 + 1);
  }));
}

// Test için iç durumu dışarı aç
window.__MT = { TIERS, I18N, get G() { return G; }, setLang: l => { lang = l; applyLang(); } };

applyLang(); resize(); requestAnimationFrame(loop);
})();
</script>
