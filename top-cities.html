<title>Top Cities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700;800&display=swap">
<style>
/* Layout: full-bleed canvas (atlas map or level); paper chips float on top, country card docks bottom-left */
:root{
  --ink:#1f2b33; --muted:#5b6a72; --paper:#fbf3e2; --paper2:#efe2c4;
  --accent:#ff7a1a; --sea:#1d4b5d; --good:#2f7d4a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea)}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--paper);display:flex;align-items:center;gap:8px;text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap}
.brand i,.intro-title i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb067,#f0610f);display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);flex:none}
.brand span{font-weight:600;opacity:.8}
.spacer{flex:1}
.chip{background:var(--paper);color:var(--ink);border:0;border-radius:12px;height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;
  font:800 15px var(--body);box-shadow:0 2px 0 rgba(0,0,0,.18);font-variant-numeric:tabular-nums;white-space:nowrap;box-sizing:border-box}
button.chip,select.chip{cursor:pointer}
select.chip{-webkit-appearance:none;appearance:none;padding:0 12px;text-align:center}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip svg{width:20px;height:20px;flex:none}
.chip.off{opacity:.55}
.gold{color:#d9950c}
.hud-title{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);background:var(--paper);border-radius:12px;height:40px;display:flex;align-items:center;padding:0 12px;box-shadow:0 2px 0 rgba(0,0,0,.18);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));color:rgba(251,243,226,.78);font-size:13px;pointer-events:none;line-height:1.4}
.credit{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));color:rgba(251,243,226,.78);font-size:12px;pointer-events:none;text-align:right;line-height:1.25}
.credit b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--paper)}
#card{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 24px));box-sizing:border-box;background:var(--paper);border-radius:16px;padding:14px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;z-index:2}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-top>div{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#card h2{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:2px 0 0}
.place{font-weight:800;font-size:16px}
.haz{font-size:14px;color:var(--muted);line-height:1.4}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.stars3{font-size:22px;letter-spacing:2px;color:#d9950c}
.badge{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--paper2);color:var(--muted)}
.badge.special{background:#ffe2cc;color:#b24a00}
.btn{height:44px;padding:0 18px;border-radius:12px;border:0;font:800 16px var(--body);background:var(--paper2);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 0 #c25200}
.x{background:transparent;border:0;font-size:26px;line-height:1;width:36px;height:36px;border-radius:10px;cursor:pointer;color:var(--muted)}
#touch .tb{position:fixed;border-radius:50%;background:rgba(31,43,51,.22);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;touch-action:none;color:#fff}
#touch .tb svg{width:38px;height:38px}
#touch .tb.on{background:rgba(255,122,26,.55)}
#tL{width:78px;height:78px;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tR{width:78px;height:78px;left:calc(108px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tJ{width:96px;height:96px;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#done,#quiz{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,30,36,.45);padding:16px;z-index:3}
#done[hidden],#quiz[hidden]{display:none}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopts:empty,.place:empty{display:none}
.qopt{text-align:left;width:100%}
.qopt.ok{background:var(--accent);color:#fff}
.qopt.bad{opacity:.5;text-decoration:line-through}
.qopt:disabled{cursor:default}
.heart{color:var(--accent);font-size:20px;line-height:1}
.heart.off{opacity:.22}
.panel{background:var(--paper);border-radius:18px;padding:20px 22px;width:min(360px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.panel h2{font-family:var(--display);font-weight:800;margin:0;font-size:32px;line-height:1.05;text-wrap:balance}
.bigstars{font-size:42px;letter-spacing:6px;color:#d9950c;line-height:1}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.stats b{color:var(--ink);font-size:18px;display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(31,43,51,.86);color:var(--paper);padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;width:max-content;max-width:min(560px,calc(100vw - 32px));text-align:center;pointer-events:none;line-height:1.35}
/* açılış: haritanın üstünde, altta başlık + Başla; harita ve zıplayan top üstte görünür */
#intro{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(to bottom,rgba(22,58,72,0) 42%,rgba(22,58,72,.9) 70%,rgba(22,58,72,.96) 100%);padding:24px 24px calc(56px + env(safe-area-inset-bottom,0px));box-sizing:border-box;text-align:center;color:var(--paper)}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.intro-name{font-family:var(--display);font-weight:800;font-size:clamp(44px,10vw,84px);line-height:.95;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:rise .7s ease-out .2s both}
.intro-title{font-family:var(--display);font-weight:600;font-size:clamp(18px,3.6vw,26px);opacity:.85;animation:rise .6s ease-out .5s both}
#introGo{margin-top:14px;min-width:160px;height:52px;font-size:18px;animation:rise .6s ease-out .8s both}
body:has(#intro:not([hidden])) .credit{z-index:11;display:block}
body:has(#intro:not([hidden])) :is(#mapbar,#card,#mapHint){visibility:hidden}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro-name,.intro-title,#introGo{animation:none}}
@media (max-width:620px){ .brand span{display:none} .hud-title{display:none} .credit{display:none} #backBtn span{display:none} #hud #hLvl{display:inline-flex} }
.chip{flex-shrink:0}
#banner{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:26%;background:var(--paper);border-radius:18px;padding:14px 26px 16px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3);pointer-events:none;z-index:2;max-width:calc(100vw - 32px);box-sizing:border-box;transition:opacity .4s ease-out;animation:rise .35s ease-out both}
#banner.out{opacity:0}
.bName{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05;margin:2px 0}
#hLvl{display:none}
@media (max-width:350px){ #musicBtn{display:none} }
@media (max-width:440px){ .chip{padding:0 6px;min-width:34px;gap:4px} .bar{gap:5px} .brand{font-size:20px} .heart{font-size:16px} }
</style>

<canvas id="c" aria-label="Top Cities"></canvas>

<div id="mapbar" class="bar">
  <div class="brand"><i></i>Top Cities<span data-i="sub"></span></div>
  <div class="spacer"></div>
  <div class="chip" id="totalStars"></div>
  <select class="chip" id="langSel" aria-label="Dil / Language"></select>
  <button class="chip" id="touchBtn" aria-label="Touch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v5"/><path d="M13 10a2 2 0 0 1 4 0v1.5a2 2 0 0 1 3 1.7V16a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.5 15a1.8 1.8 0 0 1 3-2L9 15"/></svg></button>
  <button class="chip" id="muteBtn" aria-label="Ses"></button>
</div>
<div class="hint" id="mapHint"><span data-i="hint1"></span><br><span data-i="hint2"></span></div>
<div class="credit" id="credit"><span data-i="producer"></span><b>GÖKHAN ATALAR</b></div>

<div id="card" hidden>
  <div class="card-top">
    <div><div class="eyebrow" id="cCont"></div><h2 id="cName"></h2></div>
    <button class="x" id="cClose" aria-label="×">×</button>
  </div>
  <div class="place" id="cPlace"></div>
  <div class="haz" id="cHaz"></div>
  <div class="card-foot">
    <div class="stars3" id="cStars"></div>
    <span class="badge" id="cBadge"></span>
    <div class="spacer"></div>
    <button class="btn primary" id="cPlay" data-i="play"></button>
  </div>
</div>

<div id="hud" class="bar" hidden>
  <button class="chip" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i="map"></span></button>
  <div class="hud-title" id="hTitle"></div>
  <div class="chip" id="hLvl"></div>
  <div class="spacer"></div>
  <div class="chip" id="hStars"></div>
  <div class="chip" id="hTries"></div>
  <button class="chip" id="restartBtn" aria-label="⟲"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
  <button class="chip" id="musicBtn" aria-label="♪"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
  <button class="chip" id="touchBtn2" aria-label="Touch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v5"/><path d="M13 10a2 2 0 0 1 4 0v1.5a2 2 0 0 1 3 1.7V16a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.5 15a1.8 1.8 0 0 1 3-2L9 15"/></svg></button>
  <button class="chip" id="muteBtn2" aria-label="Ses"></button>
</div>

<div id="touch" hidden>
  <div class="tb" id="tL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="tb" id="tR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
  <div class="tb" id="tJ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></div>
</div>

<div id="done" hidden>
  <div class="panel" role="dialog" aria-labelledby="dTitle">
    <div class="eyebrow" id="dEyebrow"></div>
    <h2 id="dTitle"></h2>
    <div class="bigstars" id="dStars"></div>
    <div class="stats"><div><span data-i="time"></span><b id="dTime"></b></div><div><span data-i="try"></span><b id="dTries"></b></div></div>
    <div class="btns">
      <button class="btn primary" id="dNext" data-i="next"></button>
      <button class="btn" id="dAgain" data-i="again"></button>
      <button class="btn" id="dMap" data-i="map"></button>
    </div>
  </div>
</div>
<div id="quiz" hidden>
  <div class="panel" role="dialog" aria-labelledby="qTitle">
    <div class="eyebrow" id="qEyebrow"></div>
    <h2 id="qTitle"></h2>
    <div class="haz" id="qSub"></div>
    <div class="eyebrow" id="qNum"></div>
    <div class="place" id="qText"></div>
    <div class="qopts" id="qOpts"></div>
    <div class="btns" id="qBtns" hidden>
      <button class="btn primary" id="qGo"></button>
      <button class="btn" id="qMap" data-i="map"></button>
    </div>
  </div>
</div>
<div id="banner" hidden aria-live="polite">
  <div class="eyebrow" id="bLvl"></div>
  <div class="bName" id="bName"></div>
  <div class="place" id="bPlace"></div>
</div>
<div id="toast" hidden></div>

<div id="intro">
  <div class="intro-in">
    <div class="intro-name">Top Cities</div>
    <div class="intro-title" data-i="sub"></div>
    <button class="btn primary" id="introGo" data-i="start"></button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- yardımcılar ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);return'#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1)}
const $=id=>document.getElementById(id);
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

// ---------- kayıt ----------
const SAVE_KEY='topcities-v1';
let save={};
try{save=JSON.parse(load(SAVE_KEY)||'{}')||{}}catch(e){save={}}

// ================= DİL (5 dil) =================
const LANGS=['tr','en','de','es','fr'],LANG_LABEL={tr:'TR · Türkçe',en:'EN · English',de:'DE · Deutsch',es:'ES · Español',fr:'FR · Français'};

if(!LANGS.includes(lang)){const n=(navigator.language||'tr').slice(0,2).toLowerCase();lang=LANGS.includes(n)?n:'en'}
const LI=()=>LANGS.indexOf(lang);

function pick(s){const a=s.split('|');return a[LI()]||a[0]}
const STR={

 introTr:['Asya yakasından Avrupa yakasına geç. Trafiğe dikkat!','Cross from the Asian side to the European side. Watch the traffic!','Von der asiatischen auf die europäische Seite. Achte auf den Verkehr!','Cruza del lado asiático al europeo. ¡Cuidado con el tráfico!','Passe de la rive asiatique à la rive européenne. Attention à la circulation !'],
 introGr:['Akropolis’te düşen taşlardan kaç, gemiden gemiye atla, sonra sapanla Türkiye kıyısına uç!','Dodge falling stones at the Acropolis, hop between ships, then slingshot to the Turkish coast!','Weiche fallenden Steinen aus, spring über Schiffe und schleudere dich zur türkischen Küste!','Esquiva piedras, salta entre barcos y lánzate a la costa turca!','Évite les pierres, saute de bateau en bateau, puis catapulte-toi vers la Turquie !'],
 introAval:['Kaç! Çığ geliyor. Top kendi yuvarlanır, sen sadece zıpla. Başlamak için bir tuşa bas.','Run! An avalanche is coming. You roll by yourself, just jump. Press any key to start.','Lauf! Eine Lawine kommt. Du rollst von allein, spring nur. Drück eine Taste.','¡Corre! Viene una avalancha. Ruedas solo, tú solo salta. Pulsa una tecla.','Cours ! Une avalanche arrive. Tu roules tout seul, saute seulement. Appuie sur une touche.'],
 introMoai:['Kaç! Dev Moai heykeli yuvarlanıyor. Top kendi yuvarlanır, sen sadece zıpla. Başlamak için bir tuşa bas.','Run! A giant Moai is rolling after you. You roll by yourself, just jump. Press any key to start.','Lauf! Ein riesiger Moai rollt dir nach. Du rollst von allein, spring nur. Drück eine Taste.','¡Corre! Un Moai gigante rueda tras de ti. Tú solo salta. Pulsa una tecla.','Cours ! Un Moai géant te poursuit. Saute seulement. Appuie sur une touche.'],
 introUnder:['Su altındasın: zıpla tuşuna art arda basarak yüz.','You are underwater: tap jump repeatedly to swim.','Du bist unter Wasser: tippe mehrmals auf Springen, um zu schwimmen.','Estás bajo el agua: pulsa saltar varias veces para nadar.','Tu es sous l’eau : appuie plusieurs fois sur sauter pour nager.'],
 introBoss:['Final! Buz Devi’nin üstüne 3 kez zıpla, buz kapı kırılsın.','Finale! Jump on the Ice Giant 3 times to break the ice gate.','Finale! Spring 3-mal auf den Eisriesen, um das Eistor zu brechen.','¡Final! Salta 3 veces sobre el Gigante de hielo para romper la puerta.','Finale ! Saute 3 fois sur le Géant de glace pour briser la porte.'],

let actx=null,muted=load('topcities-mute')==='1',musicOn=load('topcities-music')!=='0',noiseBuf=null;
function audio(){if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{actx=new AC()}catch(e){return null}}if(actx.state==='suspended'&&!document.hidden)actx.resume();return actx}
function getNoise(a){if(!noiseBuf){const r=mulberry32(99),len=Math.floor(a.sampleRate*0.6);noiseBuf=a.createBuffer(1,len,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=r()*2-1}return noiseBuf}
function tone(f0,f1,dur,type,vol,delay){if(muted)return;const a=audio();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.03)}
function noiseHit(a,dest,t,dur,vol,type,freq){const src=a.createBufferSource();src.buffer=getNoise(a);const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);src.connect(f).connect(g).connect(dest);src.start(t,(t*7.3)%0.4);src.stop(t+dur+0.02)}
function noise(dur,vol,freq){if(muted)return;const a=audio();if(!a)return;noiseHit(a,a.destination,a.currentTime,dur,vol,'lowpass',freq)}

function midiF(s,deg){const n=s.sc.length,o=Math.floor(deg/n),m=s.root+s.sc[((deg%n)+n)%n]+12*o;return 440*Math.pow(2,(m-69)/12)}

  const st=STY[STYLE_OF[c.id]||'europe'],r=mulberry32(hashStr(c.id)*7+3),len=128,mel=new Array(len).fill(null);
  const phrase=()=>{const p=new Array(32).fill(null);let d=Math.floor(r()*5);for(let i=0;i<32;i++){const pr=i%4===0?0.75:(i%2===0?0.4:0.16);if(r()<pr){d=clamp(d+[-2,-1,-1,0,1,1,2][Math.floor(r()*7)],-2,9);let l=1;while(l<4&&i+l<32&&r()<0.35)l++;p[i]={d,l};i+=l-1}}p[28]={d:0,l:4};p[29]=p[30]=p[31]=null;return p};

function mnote(a,f,t,dur,wave,vol){const o=a.createOscillator(),g=a.createGain();o.type=wave;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.06,dur));

  if(n)mnote(a,midiF(s,n.d+s.sc.length),t,step*n.l*0.9,s.wave,sq?0.07:0.11);
  if(bi===0||bi===8||(s.drum==='latin'&&(bi===6||bi===14)))mnote(a,midiF(s,ch-s.sc.length),t,step*3,'sine',0.16);

  if(d.h.includes(bi))noiseHit(a,M.gain,t,0.035,0.07,'highpass',7000);

const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,T=0,mode='map';
const view={s:1},cam={x:0,y:0};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);view.s=clamp(Math.min(H/620,W/980),0.42,1.5);mapLimits()}

// ================= HARİTA =================
const map={lon:30,lat:28,k:0,minK:1,maxK:8,sel:null,pointers:new Map(),moved:false,pinch:null};
function mapLimits(){map.minK=Math.max(W/360,H/(LAT_MAX-LAT_MIN));map.maxK=map.minK*8;if(!map.k)map.k=Math.max(map.minK*1.05,H/140);map.k=clamp(map.k,map.minK,map.maxK);clampMap()}
function clampMap(){const hw=W/2/map.k,hh=H/2/map.k;map.lon=clamp(map.lon,-180+hw,180-hw);map.lat=clamp(map.lat,LAT_MIN+hh,LAT_MAX-hh)}
function proj(lon,lat){return[(lon-map.lon)*map.k+W/2,(map.lat-lat)*map.k+H/2]}
function zoomAt(sx,sy,f){const lon=map.lon+(sx-W/2)/map.k,lat=map.lat-(sy-H/2)/map.k;map.k=clamp(map.k*f,map.minK,map.maxK);map.lon=lon-(sx-W/2)/map.k;map.lat=lat+(sy-H/2)/map.k;clampMap()}
function pinR(){return clamp(3+map.k*0.9,6,12)}
function polyPath(pts){ctx.beginPath();pts.forEach((p,i)=>{const[x,y]=proj(p[0],p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
function starPath(x,y,ro,ri){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?ri:ro;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}

function drawMap(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#1d4b5d';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.beginPath();
  for(let lo=-180;lo<=180;lo+=30){const[x]=proj(lo,0);ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let la=-60;la<=90;la+=30){const[,y]=proj(0,la);ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
  ctx.fillStyle='rgba(251,243,226,0.35)';ctx.font='700 11px "Nunito Sans",system-ui,sans-serif';ctx.textBaseline='bottom';ctx.textAlign='left';
  for(let la=-60;la<=60;la+=30){const[,y]=proj(0,la);ctx.fillText(la===0?'0°':Math.abs(la)+'°'+tx(la>0?'N':'S'),8,y-3)}
  ctx.font='italic 700 '+clamp(map.k*2.2,11,18)+'px "Nunito Sans",system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(251,243,226,0.22)';
  for(const[k,lo,la]of OCEAN_LABELS){const[x,y]=proj(lo,la);ctx.fillText(tx(k),x,y)}
  ctx.lineJoin='round';
  for(const p of LAND){polyPath(p);ctx.fillStyle='#ead9ae';ctx.fill();ctx.strokeStyle='#b39a63';ctx.lineWidth=1.2;ctx.stroke()}
  for(const p of LAKES){polyPath(p);ctx.fillStyle='#1d4b5d';ctx.fill();ctx.strokeStyle='#b39a63';ctx.stroke()}
  const pr=pinR(),labels=[];
  for(const c of COUNTRIES){
    const[x,y]=proj(c.lon,c.lat);if(x<-30||y<-30||x>W+30||y>H+30)continue;
    const sv=save[c.id],sp=SPECIAL.includes(c.id)||c.id==='aq',sel=map.sel===c;
    const r=pr*(sp?1.3:1)*(sel?1.2:1);
    if(sel){ctx.strokeStyle='rgba(255,122,26,0.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r+5+2.5*Math.sin(T*4),0,7);ctx.stroke()}
    ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.arc(x+1,y+2,r,0,7);ctx.fill();
    ctx.fillStyle=sv&&sv.done?'#2f7d4a':'#ff7a1a';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.strokeStyle='#fbf3e2';ctx.lineWidth=sp?3:2;ctx.stroke();
    if(sv&&sv.done&&r>7){ctx.fillStyle='#fbf3e2';ctx.font='800 '+Math.round(r*1.1)+'px "Nunito Sans",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sv.stars,x,y+1)}
    else if(sp){starPath(x,y,r*0.6,r*0.26);ctx.fillStyle='#fbf3e2';ctx.fill()}
    else if(CHASE[c.id]&&r>7){ctx.fillStyle='#fbf3e2';ctx.beginPath();ctx.moveTo(x-r*0.45,y-r*0.45);ctx.lineTo(x+r*0.5,y);ctx.lineTo(x-r*0.45,y+r*0.45);ctx.closePath();ctx.fill()}
    else if(r>8){ctx.fillStyle='#fbf3e2';ctx.font='800 '+Math.round(r*0.95)+'px "Nunito Sans",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.n,x,y+1)}
  }
  const order=COUNTRIES.slice().sort((a,b)=>(b===map.sel)-(a===map.sel)||(b.id==='tr')-(a.id==='tr'));
  ctx.font='800 12.5px "Nunito Sans",system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  for(const c of order){
    const[x,y]=proj(c.lon,c.lat);if(x<-60||y<-20||x>W+60||y>H+20)continue;
    const nm=cname(c),w=ctx.measureText(nm).width,r=pr*(c.id==='tr'?1.3:1)+5;

  const HOP=0.8,REST=0.22,cyc=HOP+REST,i=Math.floor(T/cyc),u=T/cyc-i,a=HOPS[i%HOPS.length],b=HOPS[(i+1)%HOPS.length];
  const[ax,ay]=proj(a.lon,a.lat),[bx,by]=proj(b.lon,b.lat),rb=clamp(map.k*3.2,16,26),s=rb/R;
  const p=Math.min(1,u*cyc/HOP),air=u*cyc<HOP,e=p<0.5?2*p*p:1-2*(1-p)*(1-p);
  const gx=ax+(bx-ax)*e,gy=ay+(by-ay)*e,hgt=air?Math.sin(Math.PI*p)*Math.max(60,Math.hypot(bx-ax,by-ay)*0.55):0;
  const land=air?0:(u*cyc-HOP)/REST,squash=air?(p<0.08?0.25*(1-p/0.08):0):0.3*Math.sin(Math.PI*land);
  ctx.fillStyle='rgba(0,0,0,'+(0.28-0.16*Math.min(1,hgt/120))+')';ctx.beginPath();ctx.ellipse(gx,gy+2,rb*(1-0.4*Math.min(1,hgt/120)),rb*0.35,0,0,7);ctx.fill();

  constructor(x,y){this.x=x;this.y=y;this.s={};this.polys=[];this.bottom=1600;this.cur=null;this.start({})}
  start(s){this.s=s||{};this.cur=[[this.x,this.y]]}
  to(dx,dy){this.x+=dx;this.y+=dy||0;this.cur.push([this.x,this.y])}
  wall(dy){this.y+=dy;this.cur.push([this.x,this.y])}
  end(){if(this.cur&&this.cur.length>1){const p=this.cur.slice();p.push([this.x,this.bottom],[p[0][0],this.bottom]);this.polys.push({pts:p,ice:!!this.s.ice,mud:!!this.s.mud,belt:this.s.belt||0})}this.cur=null}
  gap(len,dy){const s=this.s;this.end();this.x+=len;this.y+=dy||0;this.start(s)}
  surf(s){s=s||{};const a=this.s;if(!!a.ice===!!s.ice&&!!a.mud===!!s.mud&&(a.belt||0)===(s.belt||0))return;this.end();this.start(s)}

}

function levelGen(c){
  const L=baseLevel(c,c.theme),cfg=L.cfg,th=L.th,r=mulberry32(L.seed),chase=CHASE[c.id];
  L.seaLevel=!!(th.sea||cfg.sea);
  const pool=chase?CHASE_POOL:cfg.p.split(' ');
  const B=new Builder(-600,cfg.high?340:520);B.to(1120);L.start={x:140,y:B.y-R-1};
  const n=8+Math.round(L.diff*6),third=Math.floor(n/3);
  const starAt=new Set([1+Math.floor(r()*third),third+1+Math.floor(r()*third),Math.min(n-1,2*third+1+Math.floor(r()*third))]);
  for(let i=0;i<n;i++){
    if(i===Math.floor(n/2)){B.surf({});B.to(160);L.checks.push({x:B.x-80,y:B.y})}
    const ic=cfg.iceRamp?i/n:(cfg.ice||0);if(ic)B.setIce(r()<ic);else B.surf({});
    const name=pool[Math.floor(r()*pool.length)];
    const x0=B.x,y0=B.y;
    CHUNKS[name](B,L,r);
    if(starAt.has(i))L.stars.push({x:(x0+B.x)/2,y:Math.min(y0,B.y)-150});
  }
  B.surf({});
  if(cfg.boss){
    B.to(260);const ax=B.x;L.checks.push({x:ax-80,y:B.y});B.to(1000);
    L.boss={kind:'boss',x:ax+560,y:B.y-130,w:150,h:130,x1:ax+60,x2:ax+960,hp:3,inv:0,vx:-150,dead:false,deadT:0};L.bodies.push(L.boss);
    for(let k=0;k<3;k++)L.bodies.push(mkFaller(ax+220+k*260,B.y,2.4,k*0.8,'icicle'));
    L.gate={kind:'gate',x:ax+985,y:B.y-460,w:40,h:460,gone:false};L.bodies.push(L.gate);
  }
  B.to(700);L.finish={x:B.x-260,y:B.y};B.to(600);B.end();
  L.polys.push(...B.polys);L.width=B.x-600;

function buildLevel(c){
  const L=c.id==='tr'?levelTurkey(c):c.id==='gr'?levelGreece(c):levelGen(c);
  for(const p of L.polys){
    let mnx=1e9,mxx=-1e9;const n=p.pts.length;
    for(let i=0;i<n;i++){
      const a=p.pts[i],b=p.pts[(i+1)%n];
      mnx=Math.min(mnx,a[0]);mxx=Math.max(mxx,a[0]);
      if(a[1]>=1599&&b[1]>=1599)continue;
      L.segs.push({ax:a[0],ay:a[1],bx:b[0],by:b[1],ice:p.ice,mud:p.mud,belt:p.belt,minx:Math.min(a[0],b[0]),maxx:Math.max(a[0],b[0]),miny:Math.min(a[1],b[1]),maxy:Math.max(a[1],b[1])});
    }
    p.minx=mnx;p.maxx=mxx;
  }
  for(const x of[0,L.width])L.segs.push({ax:x,ay:-3000,bx:x,by:3000,minx:x,maxx:x,miny:-3000,maxy:3000,wall:true});
  // hareketli nesneleri t=0 konumuna yerleştir (yürüyen/akan nesneler zaten yerinde)
  for(const o of L.bodies){if(o.kind==='bug'||o.kind==='car'||o.kind==='boss')continue;updateBody(o,0,1,null);o.vx=0;o.vy=0}
  return L;
}
function groundYAt(L,x){let best=null;for(const s of L.segs){if(s.wall||s.ax===s.bx||x<s.minx||x>s.maxx)continue;const y=s.ay+(x-s.ax)/(s.bx-s.ax)*(s.by-s.ay);if(best===null||y<best)best=y}return best}

  (QX[c.id]||[]).forEach(x=>pool.push(()=>({q:pick(x[0]),a:pick(x[1]),w:[pick(x[2]),pick(x[3])]})));

// ---------- fizik ----------
function segContact(px,py,s,rr){const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;let u=l2?((px-s.ax)*dx+(py-s.ay)*dy)/l2:0;u=clamp(u,0,1);const ex=px-(s.ax+u*dx),ey=py-(s.ay+u*dy),d2=ex*ex+ey*ey;if(d2>=rr*rr)return null;const d=Math.sqrt(d2)||1e-4;return{nx:ex/d,ny:ey/d,pen:rr-d}}
function rectContact(px,py,x,y,w,h,rr){rr=rr||R;const cx=clamp(px,x,x+w),cy=clamp(py,y,y+h);const ex=px-cx,ey=py-cy,d2=ex*ex+ey*ey;if(d2>=rr*rr)return null;if(d2<1e-6)return{nx:0,ny:-1,pen:py-y+rr};const d=Math.sqrt(d2);return{nx:ex/d,ny:ey/d,pen:rr-d}}
function resolve(b,c,ovx,ovy){b.x+=c.nx*c.pen;b.y+=c.ny*c.pen;const rvx=b.vx-ovx,rvy=b.vy-ovy,vn=rvx*c.nx+rvy*c.ny;if(vn<0){const e=vn<-420?0.22:0;b.vx-=(1+e)*vn*c.nx;b.vy-=(1+e)*vn*c.ny;if(vn<-260)b.impact=Math.max(b.impact,-vn)}}
const SOLID={plat:1,ship:1,rock:1};

function collide(g){
  const b=g.ball,L=g.L;let best=0;b.ground=false;b.gvx=0;b.gvy=0;b.gice=false;b.gmud=false;
  const setGround=(c,gvx,gvy,ice,mud)=>{if(c.ny<-0.55&&c.ny<best){best=c.ny;b.ground=true;b.gvx=gvx;b.gvy=gvy;b.gice=!!ice;b.gmud=!!mud}};
  for(let it=0;it<2;it++){
    for(const s of L.segs){if(b.x+R<s.minx||b.x-R>s.maxx||b.y+R<s.miny||b.y-R>s.maxy)continue;const c=segContact(b.x,b.y,s,R);if(!c)continue;resolve(b,c,0,0);setGround(c,s.belt||0,0,s.ice,s.mud)}
    for(const o of L.bodies){
      if(o.kind==='bug'){if(o.dead)continue;const c=rectContact(b.x,b.y,o.x,o.y,o.w,o.h);if(!c)continue;
        if(c.ny<-0.3){o.dead=true;o.deadT=0;b.vy=-(input.j?820:600);b.boost=true;SFX.stomp()}else{die('hit');return}continue}
      if(o.kind==='boss'){if(o.dead)continue;const c=rectContact(b.x,b.y,o.x,o.y,o.w,o.h);if(!c)continue;
        if(c.ny<-0.3){b.vy=-(input.j?900:700);b.boost=true;if(o.inv<=0){o.hp--;o.inv=1.2;SFX.bosshit();if(o.hp<=0){o.dead=true;o.deadT=0;if(L.gate){L.gate.gone=true;L.gate.goneT=0}SFX.shatter()}}}
        else if(o.inv>0.6){resolve(b,c,o.vx,0)}else{die('hit');return}continue}
      if(o.kind==='car'){
        // sadece şeridin görünen kısmı (iki uç arasındaki) çarpışır
        const x1=Math.max(o.x,o.xa),x2=Math.min(o.x+o.w,o.xb);if(x2-x1<4)continue;const c=rectContact(b.x,b.y,x1,o.y,x2-x1,o.h);if(!c)continue;
        if(c.ny<-0.35){resolve(b,c,o.vx,0);setGround(c,o.vx,0,false)}else{die('hit');return}continue}
      if(o.kind==='croc'){if(o.y<o.baseY-2&&rectContact(b.x,b.y,o.x+o.w-4,o.y-4,38,18,R-4)){die('hit');return}
        const c=rectContact(b.x,b.y,o.x,o.y,o.w,o.h);if(!c)continue;resolve(b,c,0,o.vy);setGround(c,0,o.vy,false);continue}
      if(SOLID[o.kind]||(o.kind==='crumble'&&o.st<2)||(o.kind==='gate'&&!o.gone)){const c=rectContact(b.x,b.y,o.x,o.y,o.w,o.h);if(!c)continue;resolve(b,c,o.vx||0,o.vy||0);setGround(c,o.vx||0,o.vy||0,o.skin==='ice');if(c.ny<-0.55)o.touched=true}
    }
  }
}

function physics(g,dt,inp){
  const L=g.L,b=g.ball,dir=(inp.r?1:0)-(inp.l?1:0),uw=L.under;
  if(b.vy>=0)b.boost=false;
  b.vy=Math.min(b.vy+G*(uw?0.4:1)*dt,uw?330:1500);
  // zıpla tuşu bırakılınca kısa zıplama; yay, gayzer ve ezme fırlatmaları tam yükseklikte kalır
  if(!inp.j&&b.vy<-200&&!b.flying&&!b.boost&&!uw)b.vy+=G*1.3*dt;
  for(const w of L.winds)if(b.x>w.x1&&b.x<w.x2)b.vx+=w.f*(0.8+0.2*Math.sin(g.t*1.9+w.x1))*dt*(b.ground?0.55:1);
  if(b.ground){
    const ice=b.gice,mud=b.gmud,acc=ice?ICEACC:mud?800:ACC,cap=ice?MAXV*1.3:mud?200:MAXV;let rel=b.vx-b.gvx;
    if(dir){rel+=dir*acc*(Math.sign(rel)===-dir&&!ice?1.6:1)*dt;if(Math.abs(rel)>cap&&Math.sign(rel)===dir)rel=dir*Math.max(Math.abs(rel)-acc*2*dt,cap)}
    else rel*=Math.exp(-(ice?0.35:mud?9:5.5)*dt);
    if(mud&&Math.abs(rel)>cap)rel=Math.sign(rel)*Math.max(cap,Math.abs(rel)-2400*dt);
    b.vx=rel+b.gvx;
  }else{
    if(dir&&!b.flying&&!(Math.abs(b.vx)>MAXV&&Math.sign(b.vx)===dir))b.vx+=dir*AIRACC*dt;
    if(uw)b.vx*=Math.exp(-0.8*dt);
  }
  g.swimCD-=dt;
  if(g.jumpBuf>0&&(g.coyote>0||(uw&&g.swimCD<=0))){
    if(uw){b.vy=g.coyote>0?-560:-430;g.swimCD=0.3;SFX.swim();g.fx.push({type:'bubble',x:b.x,y:b.y+R*0.6,life:0})}
    else{b.vy=-JUMP+Math.min(0,b.gvy);SFX.jump()}
    g.jumpBuf=0;g.coyote=0;b.ground=false;
  }
  g.jumpBuf-=dt;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  collide(g);
  if(g.state==='dead')return;
  if(b.ground){g.coyote=0.1;b.spin=(b.vx-b.gvx)/R;b.flying=false}else g.coyote-=dt;
  b.ang+=b.spin*dt;
  if(b.impact>0){b.squash=Math.max(b.squash,Math.min(0.26,b.impact/2800));if(b.impact>520)SFX.land();b.impact=0}
  b.squash*=Math.exp(-12*dt);
}

const geyserOn=(o,t)=>((t+o.ph)%o.per+o.per)%o.per<1.3;
function popF(s,t){if(!s.pop)return 1;const p=(((t+s.pop.ph)%s.pop.per)+s.pop.per)%s.pop.per/s.pop.per;return p<0.5?clamp(p/0.04,0,1):clamp(1-(p-0.5)/0.04,0.08,1)}
function updateBody(o,t,dt,g){
  const k=o.kind;
  if(k==='bug'){if(o.dead){o.deadT+=dt;return}
    const b=g&&g.ball;
    if(o.skin==='bull'){o.cd-=dt;
      if(!o.charge&&o.cd<=0&&b){const dx=b.x-(o.x+o.w/2);if(Math.abs(dx)<420&&Math.abs(b.y-(o.y+o.h/2))<70&&Math.sign(dx)===Math.sign(o.vx)){o.charge=true;o.vx=Math.sign(o.vx)*430}}}
    if(o.skin==='roo'){const p=((t*0.9+o.ph)%1+1)%1,air=p<0.55;o.y=o.by-(air?4*90*(p/0.55)*(1-p/0.55):0);if(air)o.x+=o.vx*dt}
    else o.x+=o.vx*dt;
    if(o.skin==='fish')o.y=o.by-8+6*Math.sin(t*2+o.ph);
    if(o.x<o.x1){o.x=o.x1;o.vx=Math.abs(o.v0);if(o.charge){o.charge=false;o.cd=1.2}}
    if(o.x+o.w>o.x2){o.x=o.x2-o.w;o.vx=-Math.abs(o.v0);if(o.charge){o.charge=false;o.cd=1.2}}
  }
  else if(k==='plat'){
    let nx,ny;
    if(o.mode==='static')return;
    if(o.mode==='orbit'){const a=o.a0+t*o.om;nx=o.cx+o.r*Math.cos(a)-o.w/2;ny=o.cy+o.r*Math.sin(a)}
    else if(o.mode==='pend'){const a=o.amp*Math.sin(t*Math.PI*2/o.period+o.phase);nx=o.px+o.len*Math.sin(a)-o.w/2;ny=o.py+o.len*Math.cos(a)}
    else if(o.mode==='line'){const s=(1-Math.cos(t*Math.PI*2/o.period+o.phase))/2;nx=o.x0+(o.x1-o.x0)*s;ny=o.y0+(o.y1-o.y0)*s}
    else{const a=t*Math.PI*2/o.period+o.phase;nx=o.x0+o.ax*Math.sin(a);ny=o.y0+o.ay*Math.sin(a)}
    o.vx=(nx-o.x)/dt;o.vy=(ny-o.y)/dt;o.x=nx;o.y=ny;
  }
  else if(k==='ship'){const nx=o.x0+o.ax*Math.sin(t*Math.PI*2/5.2+o.phase),ny=o.y0+9*Math.sin(t*Math.PI*2/2.6+o.phase*1.7);o.vx=(nx-o.x)/dt;o.vy=(ny-o.y)/dt;o.x=nx;o.y=ny}
  else if(k==='car'){o.x+=o.vx*dt;if(o.x+o.w<o.xa){o.x+=o.cyc;o.honked=false}}
  else if(k==='croc'){

  }
  else if(k==='leaper'){const p=((t+o.ph)%o.per+o.per)%o.per;if(p<1.1){const q=p/1.1;const ny=o.wy-o.hgt*4*q*(1-q);o.vy=(ny-o.y)/Math.max(dt,1e-3);o.y=ny;o.danger=ny<o.wy-6}else{o.y=o.wy+40;o.danger=false;o.vy=0}}

  else if(k==='crumble'){
    if(o.st===0&&o.touched){o.st=1;o.tt=0;SFX.crack()}
    else if(o.st===1){o.tt+=dt;if(o.tt>0.45){o.st=2;o.tt=0}}
    else if(o.st===2){o.tt+=dt;if(o.tt>3){o.st=0;o.tt=0}}

  }

const slingAng=t=>0.785+0.58*Math.sin(t*2.4-Math.PI/2);

function stepGame(dt){
  const g=game,L=g.L,b=g.ball;
  g.t+=dt;
  for(const o of L.bodies)updateBody(o,g.t,dt,g);
  for(const f of g.fx){f.life+=dt;if(f.type==='shard'){f.vy+=G*0.7*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.a+=f.va*dt}else if(f.type==='bubble'){f.y-=70*dt;f.x+=Math.sin(f.life*8)*0.6}}
  g.fx=g.fx.filter(f=>f.life<1.1);
  if(g.state==='dead'){g.deadT+=dt;if(g.deadT>0.9)respawn();return}
  if(g.state==='play'){
    if(L.autorun&&!g.run&&(input.l||input.r||input.j||g.jumpBuf>0))g.run=true;
    if(!L.autorun||g.run)g.time+=dt;
  }
  // sapan: top lastikte bekler, açı salınır, zıpla tuşu fırlatır
  if(g.held&&g.state==='play'){
    g.holdT+=dt;const s=g.held,a=slingAng(g.holdT);
    b.x=s.x-Math.cos(a)*30;b.y=s.y-78+Math.sin(a)*30;b.vx=b.vy=0;
    if(g.jumpBuf>0){b.vx=Math.cos(a)*SLV;b.vy=-Math.sin(a)*SLV;b.spin=14;b.flying=true;g.held=null;g.slingCD=0.7;g.jumpBuf=0;g.coyote=0;b.ground=false;SFX.launch()}
    return;
  }
  g.slingCD-=dt;
  let inp=NOIN;
  if(g.state==='play')inp=L.autorun?(g.run?{l:false,r:true,j:input.j}:NOIN):input;
  physics(g,dt,inp);
  if(g.state==='won'){g.wonT+=dt;if(g.wonT>0.8&&!g.panel){g.panel=true;showDone()}return}
  if(g.state!=='play')return;
  for(const s of L.spikes){const f=popF(s,g.t);if(f<0.35)continue;if(rectContact(b.x,b.y,s.x+2,s.y-s.h*f,s.w-4,s.h*f,R-4)){die('spike');return}}
  if(!L.under)for(const w of L.waters)if(b.x>w.x1&&b.x<w.x2&&b.y>w.y+10){die('splash');return}
  if(b.y>L.deathY){die('fall');return}
  for(const s of L.stars)if(!s.got&&Math.hypot(b.x-s.x,b.y-s.y)<R+18){s.got=true;SFX.star();g.fx.push({type:'pop',x:s.x,y:s.y,life:0});updateHud()}
  for(const ck of L.checks)if(!ck.on&&b.x>ck.x-10){ck.on=true;g.spawn={x:ck.x,y:ck.y-R-1};SFX.check()}
  for(const o of L.bodies){
    const k=o.kind;
    if(k==='sling'&&g.slingCD<=0&&Math.abs(b.x-o.x)<36&&b.y>o.y-150&&b.y<o.y+5){g.held=o;g.holdT=0;g.jumpBuf=0;b.flying=false;SFX.stretch();if(!g.slingHint){g.slingHint=true;showToast(tx('slingHint'),3800)}return}
    if(k==='car'&&!o.honked){const d=o.x-b.x;if(d>60&&d<340&&o.x<o.xb&&Math.abs(o.y+o.h-(b.y+R))<50){o.honked=true;SFX.horn()}}
    if(k==='croc'){const near=o.y<o.baseY&&Math.abs(b.x-(o.x+o.w+20))<170&&Math.abs(b.y-o.y)<160;const tgt=near?0.6:0.08;
      if(o.jaw>0.45&&tgt<0.3&&!o.snapped){SFX.snap();o.snapped=true}if(tgt>0.3)o.snapped=false;o.jaw+=(tgt-o.jaw)*Math.min(1,dt*10)}
    if(k==='spring'&&b.vy>=-50&&rectContact(b.x,b.y,o.x-o.w/2,o.y-16,o.w,16)){b.vy=-1250;b.y=Math.min(b.y,o.y-16-R);o.t=0;b.flying=false;b.boost=true;g.coyote=0;SFX.boing()}
    if(k==='geyser'){const on=geyserOn(o,g.t);if(on&&!o.sfx){o.sfx=1;SFX.geyser()}if(!on)o.sfx=0;if(on&&Math.abs(b.x-o.x)<36&&b.y>o.y-300&&b.y<o.y+4&&b.vy>-1000){b.vy=-1150;b.boost=true}}
    if(k==='faller'&&o.danger&&rectContact(b.x,b.y,o.x-o.w/2,o.y,o.w,o.h,R-3)){die('hit');return}
    if(k==='leaper'&&o.danger&&Math.hypot(b.x-o.x,b.y-o.y)<R+14){die('hit');return}
    if(k==='blade'){const ex=Math.cos(o.ang)*o.len,ey=Math.sin(o.ang)*o.len;if(segContact(b.x,b.y,{ax:o.cx-ex,ay:o.cy-ey,bx:o.cx+ex,by:o.cy+ey},R+6)){die('hit');return}}
  }
  // kaçış: çığ ya da Moai arkadan gelir
  if(L.chase){const ch=L.chase;
    if(!ch.active){if(g.run&&b.x>ch.armX){ch.active=true;ch.x=b.x-580;ch.gy=groundYAt(L,Math.max(0,ch.x))||b.y+R;SFX.rumble()}}
    else{ch.x=Math.max(ch.x+ch.speed*dt,b.x-620);ch.rot+=ch.speed*dt/110;const gy=groundYAt(L,ch.x);if(gy!==null)ch.gy+=(gy-ch.gy)*Math.min(1,dt*8);
      if(b.x-R<ch.x+ch.reach){die('hit');return}}}
  if(b.x>L.finish.x-20&&b.y>L.finish.y-260&&(!L.boss||L.boss.dead))win();
}

function updateCamera(dt,snap){
  const g=game,b=g.ball,L=g.L,s=view.s,vw=W/s,vh=H/s;
  let tx_=b.x+clamp(b.vx*0.3,-160,160),ty=b.y-40;
  tx_=clamp(tx_,vw/2,Math.max(vw/2,L.width-vw/2));
  ty=Math.min(ty,L.viewBottom-vh/2);
  const k=snap?1:1-Math.exp(-6*dt);cam.x+=(tx_-cam.x)*k;cam.y+=(ty-cam.y)*k;
}

function drawBall(b,t){
  const sq=b.squash;ctx.save();ctx.translate(b.x,b.y+R*sq*0.6);ctx.scale(1+sq*0.6,1-sq);
  const g=ctx.createRadialGradient(-7,-9,3,0,0,R);g.addColorStop(0,'#ffb46a');g.addColorStop(1,'#ef5f10');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.save();ctx.rotate(b.ang);ctx.strokeStyle='rgba(140,45,0,0.35)';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,R-5,0.3,1.2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,R-5,Math.PI+0.3,Math.PI+1.2);ctx.stroke();ctx.restore();
  const lx=clamp(b.vx/450,-1,1)*4,ly=clamp(b.vy/900,-1,1)*2,blink=(t%3.7)<0.12?0.15:1;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-7+lx,-5+ly,5,6*blink,0,0,7);ctx.ellipse(7+lx,-5+ly,5,6*blink,0,0,7);ctx.fill();
  if(blink>0.5){ctx.fillStyle='#1f2b33';ctx.beginPath();ctx.arc(-6+lx*1.4,-4+ly*1.4,2.6,0,7);ctx.arc(8+lx*1.4,-4+ly*1.4,2.6,0,7);ctx.fill()}
  ctx.strokeStyle='#8a2d00';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();
  if(!b.ground&&b.vy<-150)ctx.ellipse(lx,8,3,4,0,0,7);else ctx.arc(lx,4,7,0.35,Math.PI-0.35);
  ctx.stroke();
  ctx.strokeStyle='#b8460a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R-1,0,7);ctx.stroke();
  ctx.restore();
}
function drawWaters(L,t){
  const s=view.s,vx0=cam.x-W/2/s-40,vx1=cam.x+W/2/s+40;
  for(const w of L.waters){
    const x0=Math.max(w.x1,vx0),x1=Math.min(w.x2,vx1);if(x1<=x0)continue;
    const col=L.th.water||'#2f8fb5';
    const g=ctx.createLinearGradient(0,w.y,0,w.y+400);g.addColorStop(0,col);g.addColorStop(1,shade(col,-0.45));
    ctx.globalAlpha=0.86;ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x0,w.y+600);
    for(let x=x0;x<=x1;x+=12)ctx.lineTo(x,w.y+Math.sin(x*0.03+t*2)*2.5);
    ctx.lineTo(x1,w.y+Math.sin(x1*0.03+t*2)*2.5);ctx.lineTo(x1,w.y+600);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=L.cfg.lava?'rgba(255,214,120,0.7)':'rgba(255,255,255,0.55)';ctx.lineWidth=2;ctx.beginPath();for(let x=x0;x<=x1;x+=12){const y=w.y+Math.sin(x*0.03+t*2)*2.5;x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  }
}
function drawWinds(L,t){
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
  for(const w of L.winds){const len=w.x2-w.x1,dir=Math.sign(w.f);for(let k=0;k<14;k++){const off=(((k*137)%len)+dir*t*520)%len,x=w.x1+((off%len)+len)%len,gy=groundYAt(L,clamp(x,w.x1,w.x2)),y=(gy===null?500:gy)-30-((k*53)%180);ctx.moveTo(x,y);ctx.lineTo(x-dir*34,y)}}
  ctx.stroke();
}
function drawFx(g){
  for(const f of g.fx){
    if(f.type==='shard'){ctx.save();ctx.globalAlpha=Math.max(0,1-f.life);ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.fillStyle='#ef6a1a';ctx.beginPath();ctx.moveTo(-8,-6);ctx.lineTo(9,-2);ctx.lineTo(-3,8);ctx.closePath();ctx.fill();ctx.restore()}
    else if(f.type==='ring'){const wt=g.L.waters.find(w=>f.x>w.x1&&f.x<w.x2);const y=wt?wt.y:f.y;ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,0.9-f.life)+')';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.x,y,20+f.life*90,6+f.life*14,0,0,7);ctx.stroke()}
    else if(f.type==='pop'){ctx.save();ctx.globalAlpha=Math.max(0,1-f.life*1.6);starPath(f.x,f.y-f.life*60,17+f.life*10,7.5+f.life*4);ctx.fillStyle='#ffcf3d';ctx.fill();ctx.restore()}
    else if(f.type==='bubble'){ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,0.8-f.life*0.7)+')';ctx.lineWidth=1.5;for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(f.x+(k-1)*8,f.y-k*10,3+k,0,7);ctx.stroke()}}
  }
}

const PART=(()=>{const r=mulberry32(4242),a=[];for(let i=0;i<160;i++)a.push([r(),r(),r()]);return a})();
function drawWeather(L,g,t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(L.under){ctx.fillStyle='rgba(16,86,128,0.2)';ctx.fillRect(0,0,W,H)}
  const w=L.weather;if(!w)return;
  const b=g.ball,s=view.s,sx=W/2+(b.x-cam.x)*s,sy=H/2+(b.y-cam.y)*s;
  if(w==='rain'){ctx.strokeStyle='rgba(225,235,245,0.5)';ctx.lineWidth=1.3;ctx.beginPath();for(const[a,bb,c]of PART){const y=((t*(0.9+c*0.5)+bb)%1)*(H+40)-20,x=((a*(W+100)-y*0.28)%(W+100)+W+100)%(W+100)-50;ctx.moveTo(x,y);ctx.lineTo(x-5,y+16)}ctx.stroke()}
  else if(w==='snow'){ctx.fillStyle='rgba(255,255,255,0.85)';for(const[a,bb,c]of PART){const y=((t*(0.08+c*0.08)+bb)%1)*(H+20)-10,x=(a*W+Math.sin(t+c*9)*18+W)%W;ctx.beginPath();ctx.arc(x,y,1.2+c*2,0,7);ctx.fill()}}
  else if(w==='sand'){ctx.fillStyle='rgba(214,168,98,0.28)';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(240,214,170,0.55)';ctx.lineWidth=1.5;ctx.beginPath();for(const[a,bb,c]of PART){const x=W-((t*(0.6+c)+a)%1)*(W+80),y=bb*H;ctx.moveTo(x,y);ctx.lineTo(x+20+c*20,y)}ctx.stroke()}
  else if(w==='fog'||w==='dark'){const dark=w==='dark',r0=(dark?90:140)*s,r1=(dark?330:430)*s;const gr=ctx.createRadialGradient(sx,sy,r0,sx,sy,r1);gr.addColorStop(0,dark?'rgba(10,8,6,0)':'rgba(232,236,240,0)');gr.addColorStop(1,dark?'rgba(10,8,6,0.93)':'rgba(232,236,240,0.88)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
}

function drawPlay(){
  const g=game,L=g.L,th=L.th,t=g.t;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,th.sky[0]);sky.addColorStop(1,th.sky[1]);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const mtn=th.snow;
  setLayer(0.15);drawHills(L,0.15,th.far,mtn?380:430,mtn?150:60,1,mtn);
  setLayer(0.35);ctx.fillStyle=ctx.strokeStyle=th.mid;
  if(L.farDecor)L.farDecor(L,t);
  else if(L.c.lm&&LM[L.c.lm])LM[L.c.lm](L.lmX*0.35,520,L.seed,t);
  if(!L.noScatter){setLayer(0.6);drawScatter(L)}
  setLayer(1);
  if(L.decorBack)L.decorBack(L,t);
  for(const wh of L.wheels)drawWheel(wh);
  for(const cb of L.cables){ctx.strokeStyle='#3d4247';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cb.ax,cb.ay);ctx.lineTo(cb.bx,cb.by);ctx.stroke();ctx.fillStyle='#5d6670';ctx.fillRect(cb.ax-6,cb.ay,12,400);ctx.fillRect(cb.bx-6,cb.by,12,400)}
  drawTerrain(L,t);
  for(const ln of L.lanes)if(ln.style==='tunnel')drawRoad(ln);
  drawSpikes(L,t);
  for(const ck of L.checks)drawCheck(ck,t);
  drawFinish(L,t);
  for(const o of L.bodies){const k=o.kind;
    if(k==='car')drawCar(o);else if(k==='bug')drawBug(o,t,th);else if(k==='croc')drawCroc(o);else if(k==='plat')drawPlat(o,L);else if(k==='ship')drawShip(o);else if(k==='sling')drawSling(o,g);
    else if(k==='spring')drawSpring(o);else if(k==='geyser')drawGeyser(o,t);else if(k==='faller')drawFaller(o);else if(k==='leaper')drawLeaper(o);else if(k==='blade')drawBlade(o);
    else if(k==='crumble')drawCrumble(o,t);else if(k==='rock')drawRock(o,L);else if(k==='gate')drawGate(o);else if(k==='boss')drawBoss(o,t)}
  for(const ln of L.lanes){drawLaneEnd(ln,-1);drawLaneEnd(ln,1)}
  drawChaser(L,t);
  L.stars.forEach((s,i)=>drawStar(s,t,i));
  if(g.state!=='dead'){
    if(L.weather==='mirror'){const gy=groundYAt(L,g.ball.x);if(gy!==null&&gy-g.ball.y<200){ctx.save();ctx.beginPath();ctx.rect(g.ball.x-60,gy,120,140);ctx.clip();ctx.globalAlpha=0.32;ctx.translate(0,2*gy);ctx.scale(1,-1);drawBall(g.ball,t);ctx.restore()}}
    drawBall(g.ball,t);
  }
  for(const o of L.bodies)if(o.kind==='sling')drawSlingFront(o,g);
  drawFx(g);
  drawWaters(L,t);
  if(L.winds.length)drawWinds(L,t);
  drawWeather(L,g,t);
}

let touchPref=load('topcities-touch'),touchOn=touchPref===null?isTouch:touchPref==='1';
function setTouch(on,remember){touchOn=on;if(remember)store('topcities-touch',on?'1':'0');renderTouchBtns();
  if(mode==='play'&&game&&game.state!=='quiz'&&$('done').hidden)$('touch').hidden=!on;if(!on)input.l=input.r=input.j=false}
function renderTouchBtns(){['touchBtn','touchBtn2'].forEach(id=>{const b=$(id);b.classList.toggle('off',!touchOn);b.setAttribute('aria-pressed',touchOn?'true':'false');b.title=tx('touchCtl')})}
// ekrana ilk dokunuşta, kullanıcı kapatmadıysa butonları aç
addEventListener('touchstart',()=>{if(!touchOn&&load('topcities-touch')!=='0')setTouch(true,false)},{passive:true});
function jumpPress(){if(game)game.jumpBuf=0.14}
addEventListener('keydown',e=>{
  if(!$('intro').hidden){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();closeIntro()}return}
  audio();
  if(mode!=='play'||!game)return;
  if(!$('done').hidden||!$('quiz').hidden)return;
  const k=e.code;
  if(k==='ArrowLeft'||k==='KeyA'){input.l=true;e.preventDefault()}
  else if(k==='ArrowRight'||k==='KeyD'){input.r=true;e.preventDefault()}
  else if(k==='Space'||k==='ArrowUp'||k==='KeyW'){if(!input.j)jumpPress();input.j=true;e.preventDefault()}
  else if(k==='KeyR')startLevel(game.c,game.lives);
  else if(k==='Escape')backToMap();
});
addEventListener('keyup',e=>{const k=e.code;if(k==='ArrowLeft'||k==='KeyA')input.l=false;else if(k==='ArrowRight'||k==='KeyD')input.r=false;else if(k==='Space'||k==='ArrowUp'||k==='KeyW')input.j=false});
addEventListener('blur',()=>{input.l=input.r=input.j=false});
function bindTouch(id,key){const el=$(id);
  const on=e=>{e.preventDefault();audio();try{el.setPointerCapture(e.pointerId)}catch(_){}if(key==='j'&&!input.j)jumpPress();input[key]=true;el.classList.add('on')};
  const off=()=>{input[key]=false;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}
bindTouch('tL','l');bindTouch('tR','r');bindTouch('tJ','j');

function showToast(txt,ms){const t=$('toast');t.textContent=txt;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},ms||2500)}
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function renderAudioBtns(){$('muteBtn').innerHTML=$('muteBtn2').innerHTML=muted?SPK_OFF:SPK_ON;$('musicBtn').classList.toggle('off',!musicOn||muted)}
function toggleMute(){muted=!muted;store('topcities-mute',muted?'1':'0');renderAudioBtns();if(muted)musicStop();else if(game)musicStart(game.c)}
function toggleMusic(){musicOn=!musicOn;store('topcities-music',musicOn?'1':'0');renderAudioBtns();if(musicOn&&game)musicStart(game.c);else musicStop()}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=tx(el.dataset.i)});
  $('langSel').value=lang;
  if(map.sel&&!$('card').hidden)selectCountry(map.sel);
  if(game){setHudTitle(game.c);updateHud();if(!$('done').hidden)showDone()}
  renderTouchBtns();
}
const ls=$('langSel');LANGS.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=LANG_LABEL[l];ls.appendChild(o)});
ls.addEventListener('change',()=>{lang=ls.value;store('topcities-lang',lang);applyLang()});
$('muteBtn').onclick=toggleMute;$('muteBtn2').onclick=toggleMute;$('musicBtn').onclick=toggleMusic;
$('cClose').onclick=()=>{map.sel=null;$('card').hidden=true;$('mapHint').hidden=false};
$('cPlay').onclick=()=>{if(map.sel){audio();startLevel(map.sel)}};
$('backBtn').onclick=backToMap;
$('restartBtn').onclick=()=>{if(game&&game.state!=='quiz')startLevel(game.c,game.lives)};
$('qMap').onclick=backToMap;
$('touchBtn').onclick=$('touchBtn2').onclick=()=>setTouch(!touchOn,true);
$('dAgain').onclick=()=>startLevel(game.c);
$('dMap').onclick=backToMap;
$('dNext').onclick=()=>{const n=COUNTRIES[game.c.n];if(n){map.sel=n;startLevel(n)}};
function closeIntro(){if($('intro').hidden)return;audio();$('intro').hidden=true}
$('introGo').onclick=closeIntro;

// ================= DÖNGÜ =================
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  if(mode==='play'&&game){acc+=dt;while(acc>=STEP){stepGame(STEP);acc-=STEP;if(!game)break}if(game){updateCamera(dt);drawPlay()}}
  else{acc=0;drawMap()}
  requestAnimationFrame(frame);
}
resize();renderAudioBtns();applyLang();updateTotal();
selectCountry(COUNTRIES[0]);
requestAnimationFrame(frame);
window.__zip={startLevel:id=>startLevel(COUNTRIES.find(c=>c.id===id)),
  // test: tüm bayrakları tek karede çizip resim olarak döndürür
  flagSheet(cols=10,from=0,n=60){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ccc';ctx.fillRect(0,0,cv.width,cv.height);
    COUNTRIES.slice(from,from+n).forEach((c,i)=>{const x=10+(i%cols)*110,y=10+Math.floor(i/cols)*84;ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.rect(0,0,FW,FH);ctx.clip();drawFlag(c.id);ctx.restore();ctx.fillStyle='#000';ctx.font='12px sans-serif';ctx.fillText(c.id,x,y+77)});
    const u=cv.toDataURL();ctx.restore();return u},get game(){return game},input,COUNTRIES,closeIntro,step:(n)=>{for(let i=0;i<n;i++)if(game)stepGame(STEP)}};
})();
</script>
